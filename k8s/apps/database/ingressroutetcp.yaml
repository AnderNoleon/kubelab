# Acceso del docente con un cliente SQL (NET-04): db.grupo7.lab:5432
# Traefik escucha en el entrypoint "postgres" (puerto 5432 de la IP 10.10.10.200) y lo pasa a PostgreSQL.
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: postgres
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  entryPoints: [postgres]
  routes:
    - match: HostSNI(`*`)   # TCP sin TLS: todo lo que llegue al puerto 5432
      services:
        - name: postgres
          port: 5432
