apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: api
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  entryPoints: [web]
  routes:
    - match: Host(`api.grupo7.lab`)
      kind: Rule
      services:
        - name: api
          port: 80
