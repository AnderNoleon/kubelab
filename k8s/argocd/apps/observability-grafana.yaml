# Generado por scripts/generar-apps-argocd.py
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-grafana
  namespace: argocd
  labels:
    kubelab/componente: observabilidad
  annotations:
    argocd.argoproj.io/sync-wave: '4'
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
  - repoURL: https://grafana-community.github.io/helm-charts
    chart: grafana
    targetRevision: 14.3.0
    helm:
      releaseName: grafana
      valueFiles:
      - $values/k8s/observability/grafana/values.yaml
  - repoURL: https://github.com/AnderNoleon/kubelab.git
    targetRevision: main
    ref: values
  - repoURL: https://github.com/AnderNoleon/kubelab.git
    targetRevision: main
    path: k8s/observability/grafana/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    retry:
      limit: 10
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 5m
