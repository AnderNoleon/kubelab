# Generado por scripts/generar-apps-argocd.py
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-nfs-storage
  namespace: argocd
  labels:
    kubelab/componente: plataforma
  annotations:
    argocd.argoproj.io/sync-wave: '0'
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
  - repoURL: https://kubernetes-sigs.github.io/nfs-subdir-external-provisioner/
    chart: nfs-subdir-external-provisioner
    targetRevision: 4.0.18
    helm:
      releaseName: nfs-provisioner
      valueFiles:
      - $values/k8s/platform/nfs/values.yaml
  - repoURL: https://github.com/AnderNoleon/kubelab.git
    targetRevision: main
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: nfs-provisioner
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    retry:
      limit: 10
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 5m
