# Application raíz (patrón app of apps, CD-03). Es lo ÚNICO que se aplica a mano, una sola vez:
#   kubectl apply -f k8s/argocd/root.yaml
# Argo CD lee en modo solo lectura k8s/argocd/apps y desde ahí crea todas las demás Applications.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/AnderNoleon/kubelab.git
    targetRevision: main
    path: k8s/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
