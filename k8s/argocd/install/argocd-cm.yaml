apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  # URL pública (detrás de Traefik)
  url: http://argocd.grupo7.lab
  # Revisa el repositorio cada 60 s (por defecto son 180 s)
  timeout.reconciliation: 60s
  # Cuenta de solo lectura para el docente (ACC-03). Su clave se define con la CLI, ver docs/04-gitops-cicd.md
  accounts.docente: login
  # Salud de las Applications hijas: permite que las sync-waves del patrón app of apps esperen en orden
  resource.customizations.health.argoproj.io_Application: |
    hs = {}
    hs.status = "Progressing"
    hs.message = ""
    if obj.status ~= nil then
      if obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
    end
    return hs
