apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  entryPoints: [web]
  routes:
    - match: Host(`argocd.grupo7.lab`)
      kind: Rule
      services:
        - name: argocd-server
          port: 80
