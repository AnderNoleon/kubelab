# Sincronización Doppler -> Secrets de Kubernetes (SEC-02)
# El operator lee el proyecto "kubelab", configuración "prd", con el token guardado en
# el Secret doppler-token-secret (único secreto creado a mano; ver docs/05-secretos-doppler.md).
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: kubelab
  namespace: doppler-operator-system
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  tokenSecret:
    name: doppler-token-secret
  project: kubelab
  config: prd
  resyncSeconds: 60
  secrets:                       # solo estas claves llegan al namespace kubelab
    - POSTGRES_USER
    - POSTGRES_PASSWORD
    - POSTGRES_DB
    - DATABASE_URL
    - DB_READONLY_USER
    - DB_READONLY_PASSWORD
  managedSecret:
    name: kubelab-secrets        # lo usan api, postgres y el Job db-init
    namespace: kubelab
    type: Opaque
---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: monitoring
  namespace: doppler-operator-system
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  tokenSecret:
    name: doppler-token-secret
  project: kubelab
  config: prd
  resyncSeconds: 60
  secrets:                       # solo estas claves llegan al namespace monitoring
    - GRAFANA_ADMIN_USER
    - GRAFANA_ADMIN_PASSWORD
    - GRAFANA_VIEWER_USER
    - GRAFANA_VIEWER_PASSWORD
  managedSecret:
    name: grafana-secrets        # credenciales de Grafana (admin y usuario de solo lectura)
    namespace: monitoring
    type: Opaque
