# Prometheus (OBS-01, PER-02)
# Recolecta: nodos (node-exporter), Kubernetes (kube-state-metrics, kubelet/cAdvisor)
# y el /metrics de la API (pods con la anotación prometheus.io/scrape: "true").
alertmanager:
  enabled: false
prometheus-pushgateway:
  enabled: false

kube-state-metrics:
  enabled: true
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
prometheus-node-exporter:
  enabled: true
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { memory: 64Mi }

server:
  retention: 2d               # poco historial: el host tiene 6 GB de RAM
  persistentVolume:
    enabled: true            # PVC en la StorageClass por defecto (nfs-client)
    size: 4Gi
  resources:
    requests: { cpu: 50m, memory: 160Mi }
    limits: { memory: 640Mi }
  global:
    scrape_interval: 15s
