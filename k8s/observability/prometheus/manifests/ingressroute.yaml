apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: prometheus
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  entryPoints: [web]
  routes:
    - match: Host(`prometheus.grupo7.lab`)
      kind: Rule
      services:
        - name: prometheus-server
          port: 80
