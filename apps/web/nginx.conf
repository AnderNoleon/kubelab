server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-store";
    }

    # Para las probes de Kubernetes: no ensucia los logs de acceso
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
